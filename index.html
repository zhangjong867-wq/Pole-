<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Поле Чудес - Премиум</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #fbbf24;
            --bg-dark: #0f172a;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at center, #1e3a8a 0%, #020617 100%); 
            margin: 0;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .wheel-container { 
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1); 
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }
        .pointer-snap { animation: pointer-wiggle 0.1s ease-out; }
        @keyframes pointer-wiggle {
            0% { transform: translateX(-50%) rotate(0deg); }
            50% { transform: translateX(-50%) rotate(-20deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .letter-slot {
            width: clamp(35px, 8vw, 50px);
            height: clamp(50px, 12vw, 70px);
            perspective: 1000px;
        }
        .letter-flip {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .letter-flip.revealed { transform: rotateY(180deg); }
        .side {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; display: flex;
            align-items: center; justify-content: center;
            border-radius: 8px; font-weight: 900; font-size: 1.5rem;
        }
        .front { background: linear-gradient(135deg, #1d4ed8, #1e40af); border: 2px solid #3b82f6; }
        .back { background: white; color: #1e3a8a; transform: rotateY(180deg); border: 2px solid #fbbf24; }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-start p-4">

    <div id="app" class="w-full max-w-lg mt-4 space-y-6">
        <header class="flex justify-between items-end px-2">
            <div>
                <h1 class="text-3xl font-black italic text-yellow-400 tracking-tighter uppercase leading-none">Поле Чудес</h1>
                <p class="text-[10px] uppercase tracking-[0.3em] text-blue-400 font-bold">Интеллектуальное шоу</p>
            </div>
            <div class="text-right">
                <div id="score" class="text-3xl font-black leading-none">0</div>
                <div class="text-[10px] uppercase text-zinc-400 font-bold">Ваш капитал</div>
            </div>
        </header>

        <div class="relative flex justify-center py-4">
            <div id="wheel-pointer" class="absolute top-0 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[15px] border-l-transparent border-r-[15px] border-r-transparent border-t-[30px] border-t-red-600 z-20 drop-shadow-lg"></div>
            <svg id="wheel-svg" class="wheel-container w-64 h-64 md:w-80 md:h-80" viewBox="0 0 100 100">
                <!-- Sectors generated via JS -->
            </svg>
            <div class="absolute inset-0 m-auto w-10 h-10 bg-zinc-900 rounded-full border-4 border-yellow-500 z-10 flex items-center justify-center shadow-inner">
                <div class="w-2 h-2 bg-yellow-400 rounded-full animate-pulse"></div>
            </div>
        </div>

        <div class="px-2">
            <button id="spin-btn" class="w-full py-5 bg-gradient-to-b from-yellow-400 to-orange-600 rounded-2xl font-black text-black text-xl shadow-[0_6px_0_rgb(180,83,9)] active:translate-y-1 active:shadow-none transition-all uppercase">
                Вращать барабан
            </button>
        </div>

        <div class="glass p-6 rounded-3xl space-y-4">
            <div class="flex items-center gap-2">
                <span class="bg-blue-600 text-[10px] font-black px-2 py-1 rounded uppercase">Вопрос <span id="q-num">1</span>/20</span>
            </div>
            <p id="question" class="text-lg font-medium leading-tight">Загрузка...</p>
            
            <div id="word-display" class="flex flex-wrap gap-2 justify-center py-4 min-h-[80px]">
                <!-- Letters -->
            </div>
        </div>

        <div id="input-zone" class="hidden glass p-4 rounded-3xl flex flex-col gap-4">
            <!-- Tabs for Switchable Modes -->
            <div class="flex bg-slate-900/60 p-1 rounded-xl border border-zinc-700">
                <button id="tab-letter" class="flex-1 py-2 rounded-lg font-black text-xs uppercase bg-blue-600 text-white transition-all shadow-md">
                    Назвать букву
                </button>
                <button id="tab-word" class="flex-1 py-2 rounded-lg font-black text-xs uppercase text-zinc-400 hover:text-white transition-all">
                    Сказать слово сразу
                </button>
            </div>

            <!-- Mode A: Guess Single Letter -->
            <div id="mode-letter" class="flex gap-3">
                <input type="text" id="letter-input" maxlength="1" class="w-16 h-16 bg-white text-black text-center text-3xl font-black rounded-2xl outline-none focus:ring-4 focus:ring-yellow-400 uppercase" placeholder="?">
                <button id="guess-btn" class="flex-1 bg-blue-600 rounded-2xl font-black text-lg uppercase shadow-[0_4px_0_rgb(30,58,138)] active:translate-y-1 active:shadow-none transition-all">Ввести букву</button>
            </div>

            <!-- Mode B: Guess Entire Word -->
            <div id="mode-word" class="hidden flex flex-col sm:flex-row gap-3">
                <input type="text" id="word-input" class="flex-1 h-16 px-4 bg-white text-black text-center text-2xl font-black rounded-2xl outline-none focus:ring-4 focus:ring-yellow-400 uppercase tracking-widest" placeholder="СЛОВО">
                <button id="guess-word-btn" class="sm:px-6 h-16 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white rounded-2xl font-black text-lg uppercase shadow-[0_4px_0_rgb(6,95,70)] active:translate-y-1 active:shadow-none transition-all">Сказать всё слово</button>
            </div>
        </div>
    </div>

    <div id="welcome" class="fixed inset-0 bg-slate-950/95 z-50 flex items-center justify-center p-6 text-center">
        <div class="max-w-xs space-y-6">
            <div class="text-6xl mb-4">🎰</div>
            <h2 class="text-3xl font-black text-yellow-400 uppercase italic">Готовы к игре?</h2>
            <p class="text-zinc-400">Нажмите кнопку, чтобы активировать звук и начать первый раунд.</p>
            <button id="start-game" class="w-full py-4 bg-white text-black font-black rounded-2xl uppercase tracking-widest hover:bg-yellow-400 transition-colors">Играть</button>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 p-6">
        <div class="glass p-8 rounded-[2.5rem] border-2 border-yellow-500 w-full max-w-sm text-center transform scale-90 transition-transform">
            <h3 id="modal-title" class="text-2xl font-black text-yellow-400 uppercase mb-2"></h3>
            <p id="modal-text" class="text-zinc-300 mb-6"></p>
            <button id="modal-close" class="w-full py-4 bg-yellow-500 text-black font-black rounded-xl uppercase">Окей</button>
        </div>
    </div>

    <script>
        const clickNoise = new Tone.NoiseSynth({
            noise: { type: 'white' },
            envelope: { attack: 0.001, decay: 0.05, sustain: 0 }
        }).toDestination();
        const clickFilter = new Tone.Filter(2000, "lowpass").toDestination();
        clickNoise.connect(clickFilter);

        const winSynth = new Tone.PolySynth().toDestination();
        const failSynth = new Tone.MembraneSynth().toDestination();

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        const questions = [
            {q: "Напиток, который, по легенде, открыли козы в Эфиопии?", a: "КОФЕ"},
            {q: "Как называется сушеный виноград?", a: "ИЗЮМ"},
            {q: "Самая высокая трава в мире?", a: "БАМБУК"},
            {q: "Плод, который искал Геракл в саду Гесперид?", a: "ЯБЛОКО"},
            {q: "Инструмент, которым Папа Карло вырезал Буратино?", a: "НОЖ"},
            {q: "Столица Японии?", a: "ТОКИО"},
            {q: "Как называется задняя часть корабля?", a: "КОРМА"},
            {q: "Самая маленькая планета Солнечной системы?", a: "МЕРКУРИЙ"},
            {q: "Специалист по изготовлению ключей и замков?", a: "СЛЕСАРЬ"},
            {q: "Прибор для измерения времени?", a: "ЧАСЫ"},
            {q: "Лесной зверь, строящий плотины?", a: "БОБР"},
            {q: "Спорт на льду с шайбой?", a: "ХОККЕЙ"},
            {q: "Единственная птица, умеющая летать задом наперед?", a: "КОЛИБРИ"},
            {q: "Денежная единица России?", a: "РУБЛЬ"},
            {q: "Как называется блюдо из сырой рыбы в Японии?", a: "СУШИ"},
            {q: "Из чего делают манку?", a: "ПШЕНИЦА"},
            {q: "Самая длинная река в мире?", a: "АМАЗОНКА"},
            {q: "Как называется одежда космонавта?", a: "СКАФАНДР"},
            {q: "Какую птицу называют 'лесным доктором'?", a: "ДЯТЕЛ"},
            {q: "Имя первого человека в космосе?", a: "ЮРИЙ"}
        ];

        let currentQ = 0;
        let score = 0;
        let rotation = 0;
        let wheelActive = false;
        let currentSector = null;

        const sectors = [100, 500, "ПРИЗ", 200, 1000, "БАНКРОТ", 300, 700, "ПЕРЕХОД", 400, 600, 150];
        const colors = ["#ef4444", "#3b82f6", "#f59e0b", "#10b981", "#8b5cf6", "#18181b", "#ec4899", "#06b6d4", "#f97316", "#a855f7", "#84cc16", "#64748b"];

        const tabLetter = document.getElementById('tab-letter');
        const tabWord = document.getElementById('tab-word');
        const modeLetter = document.getElementById('mode-letter');
        const modeWord = document.getElementById('mode-word');

        tabLetter.onclick = () => {
            tabLetter.className = "flex-1 py-2 rounded-lg font-black text-xs uppercase bg-blue-600 text-white transition-all shadow-md";
            tabWord.className = "flex-1 py-2 rounded-lg font-black text-xs uppercase text-zinc-400 hover:text-white transition-all";
            modeLetter.classList.remove('hidden');
            modeWord.classList.add('hidden');
            document.getElementById('letter-input').focus();
        };

        tabWord.onclick = () => {
            tabWord.className = "flex-1 py-2 rounded-lg font-black text-xs uppercase bg-blue-600 text-white transition-all shadow-md";
            tabLetter.className = "flex-1 py-2 rounded-lg font-black text-xs uppercase text-zinc-400 hover:text-white transition-all";
            modeWord.classList.remove('hidden');
            modeLetter.classList.add('hidden');
            document.getElementById('word-input').focus();
        };

        function initWheel() {
            const svg = document.getElementById('wheel-svg');
            const step = 360 / sectors.length;
            
            sectors.forEach((val, i) => {
                const start = i * step;
                const end = (i + 1) * step;
                const rad1 = (start - 90) * Math.PI / 180;
                const rad2 = (end - 90) * Math.PI / 180;
                
                const x1 = 50 + 50 * Math.cos(rad1);
                const y1 = 50 + 50 * Math.sin(rad1);
                const x2 = 50 + 50 * Math.cos(rad2);
                const y2 = 50 + 50 * Math.sin(rad2);
                
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", `M 50 50 L ${x1} ${y1} A 50 50 0 0 1 ${x2} ${y2} Z`);
                path.setAttribute("fill", colors[i]);
                path.setAttribute("stroke", "#ffffff22");
                path.setAttribute("stroke-width", "0.5");
                svg.appendChild(path);

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                const angle = start + step/2;
                const trad = (angle - 90) * Math.PI / 180;
                const tx = 50 + 35 * Math.cos(trad);
                const ty = 50 + 35 * Math.sin(trad);
                
                text.setAttribute("x", tx);
                text.setAttribute("y", ty);
                text.setAttribute("fill", "white");
                text.setAttribute("font-size", "4.5");
                text.setAttribute("font-weight", "900");
                text.setAttribute("text-anchor", "middle");
                text.setAttribute("transform", `rotate(${angle}, ${tx}, ${ty})`);
                text.textContent = val;
                svg.appendChild(text);
            });
        }

        function loadQuestion() {
            const data = questions[currentQ];
            document.getElementById('q-num').textContent = currentQ + 1;
            document.getElementById('question').textContent = data.q;
            
            const container = document.getElementById('word-display');
            container.innerHTML = '';
            for(let char of data.a) {
                container.innerHTML += `
                    <div class="letter-slot">
                        <div class="letter-flip">
                            <div class="side front"></div>
                            <div class="side back">${char}</div>
                        </div>
                    </div>
                `;
            }
            wheelActive = true;
            document.getElementById('input-zone').classList.add('hidden');
            document.getElementById('spin-btn').disabled = false;
            document.getElementById('spin-btn').style.opacity = "1";
            tabLetter.click(); // Reset inputs back to letters mode
        }

        function showAlert(title, text, cb) {
            const m = document.getElementById('modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-text').textContent = text;
            m.classList.remove('pointer-events-none', 'opacity-0');
            m.querySelector('div').classList.add('scale-100');
            document.getElementById('modal-close').onclick = () => {
                m.classList.add('opacity-0', 'pointer-events-none');
                m.querySelector('div').classList.remove('scale-100');
                if(cb) cb();
            };
        }

        document.getElementById('spin-btn').onclick = () => {
            if(!wheelActive) return;
            wheelActive = false;
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('spin-btn').style.opacity = "0.5";

            const addRot = 1800 + Math.random() * 2000;
            rotation += addRot;
            const wheel = document.getElementById('wheel-svg');
            const pointer = document.getElementById('wheel-pointer');
            wheel.style.transform = `rotate(${rotation}deg)`;

            // Sound Simulation
            let lastIdx = -1;
            const startTime = performance.now();
            const duration = 5000;
            const step = 360 / sectors.length;

            function playClicks(now) {
                const elapsed = now - startTime;
                if(elapsed < duration) {
                    const progress = elapsed / duration;
                    const ease = 1 - Math.pow(1 - progress, 3);
                    const currentAngle = (rotation - addRot) + (addRot * ease);
                    const idx = Math.floor((currentAngle % 360) / step);
                    
                    if(idx !== lastIdx) {
                        clickNoise.triggerAttackRelease("16n");
                        pointer.classList.remove('pointer-snap');
                        void pointer.offsetWidth;
                        pointer.classList.add('pointer-snap');
                        lastIdx = idx;
                    }
                    requestAnimationFrame(playClicks);
                }
            }
            requestAnimationFrame(playClicks);

            setTimeout(() => {
                const finalAngle = (360 - (rotation % 360)) % 360;
                const sIdx = Math.floor(finalAngle / step);
                currentSector = sectors[sIdx];
                handleSector();
            }, 5100);
        };

        function handleSector() {
            if(currentSector === "БАНКРОТ") {
                score = 0;
                updateScore();
                speak("Банкрот! Очки сгорели.");
                showAlert("ОЙ!", "Вы банкрот. Все очки сгорели.", () => { resetTurn(); });
            } else if(currentSector === "ПЕРЕХОД") {
                speak("Переход хода.");
                showAlert("ПЕРЕХОД ХОДА", "Крутите барабан снова.", () => { resetTurn(); });
            } else {
                const text = currentSector === "ПРИЗ" ? "Сектор Приз на барабане! Назовите букву или слово." : `Сектор ${currentSector}. Назовите букву или слово целиком.`;
                speak(text);
                document.getElementById('input-zone').classList.remove('hidden');
                tabLetter.click(); // Default to letter mode when starting a guess
            }
        }

        document.getElementById('guess-btn').onclick = checkLetter;
        document.getElementById('letter-input').onkeypress = (e) => { if(e.key === 'Enter') checkLetter(); };
        
        document.getElementById('guess-word-btn').onclick = checkWholeWord;
        document.getElementById('word-input').onkeypress = (e) => { if(e.key === 'Enter') checkWholeWord(); };

        function checkLetter() {
            const input = document.getElementById('letter-input');
            const val = input.value.toUpperCase();
            input.value = '';
            
            if(!val || !/[А-ЯЁ]/.test(val)) return;

            const word = questions[currentQ].a;
            const slots = document.querySelectorAll('.letter-flip');
            let found = false;

            for(let i=0; i<word.length; i++) {
                if(word[i] === val && !slots[i].classList.contains('revealed')) {
                    slots[i].classList.add('revealed');
                    found = true;
                }
            }

            if(found) {
                speak("Правильно!");
                const points = typeof currentSector === 'number' ? currentSector : 500;
                score += points;
                updateScore();
                winSynth.triggerAttackRelease(["C4", "E4", "G4"], "4n");

                const all = Array.from(slots).every(s => s.classList.contains('revealed'));
                if(all) {
                    setTimeout(nextLevel, 1000);
                } else {
                    resetTurn();
                }
            } else {
                speak("Неправильно. Нет такой буквы.");
                failSynth.triggerAttackRelease("G2", "4n");
                showAlert("ОШИБКА", "Такой буквы нет в слове.", () => {
                    resetTurn();
                });
            }
        }

        function checkWholeWord() {
            const input = document.getElementById('word-input');
            const val = input.value.toUpperCase().trim();
            input.value = '';

            if(!val || !/^[А-
