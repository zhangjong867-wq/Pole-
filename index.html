<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поле Чудес - Классическая Версия</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle, #1e3a8a 0%, #000 100%); 
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }
        .letter-box { width: 45px; height: 60px; perspective: 1000px; }
        .letter-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d;
        }
        .letter-inner.revealed { transform: rotateY(180deg); }
        .letter-front, .letter-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; display: flex;
            align-items: center; justify-content: center;
            border-radius: 6px; font-size: 24px; font-weight: 900;
        }
        .letter-front { background: linear-gradient(135deg, #2563eb, #1e40af); border: 2px solid #3b82f6; color: transparent; }
        .letter-back { background: white; color: #1e3a8a; transform: rotateY(180deg); border: 2px solid #fbbf24; }
        .wheel-container { transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1); }
        
        @keyframes pointer-hit {
            0% { transform: translateX(-50%) rotate(0deg); }
            20% { transform: translateX(-50%) rotate(-25deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }
        .pointer-snap { animation: pointer-hit 0.1s ease-out; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-white flex items-center justify-center p-4">

    <div id="game-ui" class="max-w-6xl w-full glass-panel p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 via-yellow-400 to-blue-500"></div>
        
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-black italic tracking-tighter text-yellow-400 drop-shadow-md uppercase">Поле Чудес</h1>
                <p class="text-blue-300 font-bold uppercase text-xs tracking-widest mt-1">Интеллектуальное шоу</p>
            </div>
            <div class="text-right">
                <div class="text-3xl font-black" id="score-display">0</div>
                <div class="text-blue-400 text-xs font-bold uppercase">Ваш капитал</div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
            <!-- Left Side: Wheel -->
            <div class="lg:col-span-5 flex flex-col items-center">
                <div class="relative w-64 h-64 md:w-80 md:h-80 mb-8">
                    <svg id="wheel-svg" class="wheel-container w-full h-full" viewBox="0 0 100 100">
                        <!-- Сектора будут здесь -->
                    </svg>
                    <!-- Стрелка -->
                    <div id="wheel-pointer" class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-2 w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[24px] border-t-red-500 z-30 drop-shadow-lg"></div>
                    <!-- Центр барабана -->
                    <div class="absolute inset-0 m-auto w-8 h-8 bg-zinc-900 rounded-full border-4 border-yellow-500 z-10"></div>
                </div>
                
                <button id="spin-button" class="w-full py-5 bg-gradient-to-b from-yellow-400 to-orange-600 rounded-2xl font-black text-black text-xl shadow-[0_8px_0_rgb(154,52,18)] active:translate-y-1 active:shadow-none transition-all uppercase hover:brightness-110">
                    Вращать барабан
                </button>
            </div>

            <!-- Right Side: Game Logic -->
            <div class="lg:col-span-7 space-y-6">
                <div class="bg-black/40 p-6 rounded-2xl border border-blue-500/30">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="px-2 py-0.5 bg-blue-600 rounded text-[10px] font-bold uppercase">Вопрос <span id="q-num">1</span>/20</span>
                    </div>
                    <p id="question-label" class="text-xl font-medium leading-snug">Загрузка интересного вопроса...</p>
                </div>

                <div id="word-container" class="flex flex-wrap gap-2 justify-center py-4 min-h-[80px]">
                    <!-- Буквы -->
                </div>

                <div id="interaction-zone" class="hidden space-y-4 pt-4 border-t border-white/10">
                    <div class="flex gap-4">
                        <input type="text" id="letter-input" maxlength="1" class="w-20 h-16 bg-white text-black text-center text-3xl font-black rounded-2xl border-none outline-none focus:ring-4 focus:ring-yellow-400 transition-all uppercase" placeholder="?">
                        <button id="submit-letter" class="flex-1 bg-blue-600 hover:bg-blue-500 font-black text-lg rounded-2xl shadow-[0_5px_0_rgb(30,58,138)] active:translate-y-1 active:shadow-none transition-all uppercase">Назвать букву</button>
                    </div>
                    <button id="solve-word" class="w-full text-zinc-400 hover:text-white text-xs font-bold uppercase tracking-widest py-2 transition-colors">Я готов назвать всё слово</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-zinc-900 border-2 border-yellow-500 p-8 rounded-[2rem] text-center max-w-sm w-full mx-4 transform scale-90 transition-transform">
            <h2 id="modal-title" class="text-3xl font-black text-yellow-500 mb-2 uppercase italic">Сектор Плюс</h2>
            <p id="modal-text" class="text-lg text-zinc-300 mb-6">Ваш ход!</p>
            <button id="modal-close" class="w-full py-4 bg-white text-black font-black rounded-xl hover:bg-yellow-400 transition-colors uppercase">Продолжить</button>
        </div>
    </div>

    <script>
        const clickSynth = new Tone.MembraneSynth({
            pitchDecay: 0.008,
            octaves: 2,
            envelope: { attack: 0.0006, decay: 0.1, sustain: 0 }
        }).toDestination();

        const bellSynth = new Tone.PolySynth(Tone.Synth).toDestination();
        const errorSynth = new Tone.DuoSynth().toDestination();

        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ru-RU';
            msg.rate = 0.9;
            msg.pitch = 1.0;
            window.speechSynthesis.speak(msg);
        }

        const questions = [
            { q: "Как называется сушеный абрикос без косточки?", a: "КУРАГА" },
            { q: "Птица, которая не умеет летать, но отлично плавает?", a: "ПИНГВИН" },
            { q: "Самая маленькая птица на планете?", a: "КОЛИБРИ" },
            { q: "Столица Франции?", a: "ПАРИЖ" },
            { q: "Предмет, который помогает находить стороны света?", a: "КОМПАС" },
            { q: "Как называется замерзшая вода?", a: "ЛЕД" },
            { q: "Планета, знаменитая своими кольцами?", a: "САТУРН" },
            { q: "Животное с самым длинным шеей?", a: "ЖИРАФ" },
            { q: "На чем путешествовал Емеля в сказке?", a: "ПЕЧЬ" },
            { q: "Инструмент для письма мелом?", a: "ДОСКА" },
            { q: "Цветок с колючками на стебле?", a: "РОЗА" },
            { q: "Лесной доктор с красной шапочкой?", a: "ДЯТЕЛ" },
            { q: "Единственный металл, жидкий при комнатной температуре?", a: "РТУТЬ" },
            { q: "Вид спорта с клюшкой на льду?", a: "ХОККЕЙ" },
            { q: "Орган дыхания у рыб?", a: "ЖАБРЫ" },
            { q: "Плод дуба?", a: "ЖЕЛУДЬ" },
            { q: "Звезда, которая светит нам днем?", a: "СОЛНЦЕ" },
            { q: "Время года, когда опадают листья?", a: "ОСЕНЬ" },
            { q: "Как называется детеныш овцы?", a: "ЯГНЕНОК" },
            { q: "Материал для изготовления стеклянных бутылок?", a: "ПЕСОК" }
        ];

        let currentLevel = 0;
        let score = 0;
        let rotation = 0;
        let wheelActive = true;
        let currentSectorValue = 0;
        const wheelValues = [100, 500, "ПРИЗ", 200, 1000, "БАНКРОТ", 300, 700, "ПЕРЕХОД", 400, 600, 150];
        const wheelColors = ["#ef4444", "#3b82f6", "#f59e0b", "#10b981", "#8b5cf6", "#18181b", "#ec4899", "#06b6d4", "#f97316", "#a855f7", "#84cc16", "#64748b"];

        function createWheel() {
            const svg = document.getElementById('wheel-svg');
            const count = wheelValues.length;
            const angleStep = 360 / count;

            wheelValues.forEach((val, i) => {
                const startAngle = i * angleStep;
                const endAngle = (i + 1) * angleStep;
                const radStart = (Math.PI * (startAngle - 90)) / 180;
                const radEnd = (Math.PI * (endAngle - 90)) / 180;

                const x1 = 50 + 50 * Math.cos(radStart);
                const y1 = 50 + 50 * Math.sin(radStart);
                const x2 = 50 + 50 * Math.cos(radEnd);
                const y2 = 50 + 50 * Math.sin(radEnd);

                const d = `M 50 50 L ${x1} ${y1} A 50 50 0 0 1 ${x2} ${y2} Z`;
                
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d);
                path.setAttribute("fill", wheelColors[i]);
                path.setAttribute("stroke", "white");
                path.setAttribute("stroke-width", "0.2");
                svg.appendChild(path);

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                const textAngle = startAngle + angleStep / 2;
                const textRad = (Math.PI * (textAngle - 90)) / 180;
                const tx = 50 + 35 * Math.cos(textRad);
                const ty = 50 + 35 * Math.sin(textRad);

                text.setAttribute("x", tx);
                text.setAttribute("y", ty);
                text.setAttribute("fill", "white");
                text.setAttribute("font-size", "4");
                text.setAttribute("font-weight", "bold");
                text.setAttribute("text-anchor", "middle");
                text.setAttribute("transform", `rotate(${textAngle}, ${tx}, ${ty})`);
                text.textContent = val;
                svg.appendChild(text);
            });
        }

        function initQuestion() {
            const q = questions[currentLevel];
            document.getElementById('q-num').textContent = currentLevel + 1;
            document.getElementById('question-label').textContent = q.q;
            
            const container = document.getElementById('word-container');
            container.innerHTML = '';
            for(let i=0; i<q.a.length; i++) {
                const box = document.createElement('div');
                box.className = 'letter-box';
                box.innerHTML = `<div class="letter-inner"><div class="letter-front"></div><div class="letter-back">${q.a[i]}</div></div>`;
                container.appendChild(box);
            }
            
            toggleInput(false);
            wheelActive = true;
            document.getElementById('spin-button').classList.remove('opacity-50', 'pointer-events-none');
        }

        function toggleInput(show) {
            const zone = document.getElementById('interaction-zone');
            if(show) {
                zone.classList.remove('hidden');
                document.getElementById('letter-input').focus();
            } else {
                zone.classList.add('hidden');
            }
        }

        function showModal(title, text, callback) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-text').textContent = text;
            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.querySelector('div').classList.add('scale-100');
            
            document.getElementById('modal-close').onclick = () => {
                modal.classList.add('opacity-0', 'pointer-events-none');
                modal.querySelector('div').classList.remove('scale-100');
                if(callback) callback();
            };
        }

        document.getElementById('spin-button').onclick = async () => {
            if(!wheelActive) return;
            await Tone.start();
            wheelActive = false;
            document.getElementById('spin-button').classList.add('opacity-50', 'pointer-events-none');

            const spins = 5 + Math.random() * 5;
            const extraAngle = Math.random() * 360;
            const totalRotation = spins * 360 + extraAngle;
            rotation += totalRotation;
            
            const svg = document.getElementById('wheel-svg');
            const pointer = document.getElementById('wheel-pointer');
            svg.style.transform = `rotate(${rotation}deg)`;

            // Звук клика (трещотка)
            let lastIdx = -1;
            const startTime = performance.now();
            const duration = 5000;
            const step = 360 / wheelValues.length;

            function playClicks(now) {
                const elapsed = now - startTime;
                const progress = elapsed / duration;
                if(progress < 1) {
                    const ease = 1 - Math.pow(1 - progress, 3);
                    const currentAngle = (rotation - totalRotation) + (totalRotation * ease);
                    const idx = Math.floor((currentAngle % 360) / step);
                    if(idx !== lastIdx) {
                        clickSynth.triggerAttackRelease("C1", "16n");
                        pointer.classList.remove('pointer-snap');
                        void pointer.offsetWidth;
                        pointer.classList.add('pointer-snap');
                        lastIdx = idx;
                    }
                    requestAnimationFrame(playClicks);
                }
            }
            requestAnimationFrame(playClicks);

            setTimeout(() => {
                const finalAngle = (360 - (rotation % 360)) % 360;
                const sectorIdx = Math.floor(finalAngle / step);
                currentSectorValue = wheelValues[sectorIdx];

                processSector();
            }, 5100);
        };

        function processSector() {
            if(currentSectorValue === "БАНКРОТ") {
                score = 0;
                document.getElementById('score-display').textContent = score;
                speak("Банкрот. Очки сгорели.");
                showModal("БАНКРОТ!", "Все очки обнулены.", () => {
                    wheelActive = true;
                    document.getElementById('spin-button').classList.remove('opacity-50', 'pointer-events-none');
                });
            } else if(currentSectorValue === "ПЕРЕХОД") {
                speak("Переход хода.");
                showModal("ПЕРЕХОД ХОДА", "Крутите барабан снова.", () => {
                    wheelActive = true;
                    document.getElementById('spin-button').classList.remove('opacity-50', 'pointer-events-none');
                });
            } else {
                let text = `Сектор ${currentSectorValue} на барабане. Назовите букву.`;
                if(currentSectorValue === "ПРИЗ") text = "Сектор Приз! Назовите букву.";
                speak(text);
                showModal("ВАШ ХОД", text, () => toggleInput(true));
            }
        }

        function submitGuess() {
            const input = document.getElementById('letter-input');
            const letter = input.value.toUpperCase();
            input.value = '';
            
            if(!letter || !/[А-ЯЁ]/.test(letter)) return;
            
            const word = questions[currentLevel].a;
            const boxes = document.querySelectorAll('.letter-inner');
            let found = false;
            
            for(let i=0; i<word.length; i++) {
                if(word[i] === letter && !boxes[i].classList.contains('revealed')) {
                    boxes[i].classList.add('revealed');
                    found = true;
                }
            }
            
            if(found) {
                const val = typeof currentSectorValue === 'number' ? currentSectorValue : 500;
                score += val;
                document.getElementById('score-display').textContent = score;
                bellSynth.triggerAttackRelease(["C4", "E4", "G4"], "4n");
                speak("Правильно!");
                
                const allRevealed = Array.from(boxes).every(b => b.classList.contains('revealed'));
                if(allRevealed) {
                    winLevel();
                } else {
                    toggleInput(false);
                    wheelActive = true;
                    document.getElementById('spin-button').classList.remove('opacity-50', 'pointer-events-none');
                }
            } else {
                errorSynth.triggerAttackRelease("G2", "4n");
                speak("Неправильно. Нет такой буквы.");
                showModal("ОШИБКА", "Такой буквы в слове нет.", () => {
                    toggleInput(false);
                    wheelActive = true;
                    document.getElementById('spin-button').classList.remove('opacity-50', 'pointer-events-none');
                });
            }
        }

        function winLevel() {
            setTimeout(() => {
                bellSynth.triggerAttackRelease(["C4", "G4", "C5"], "2n");
                speak("Слово угадано! Поздравляю!");
                showModal("ПОЗДРАВЛЯЕМ!", `Слово: ${questions[currentLevel].a} отгадано!`, () => {
                    currentLevel++;
                    if(currentLevel < questions.length) {
                        initQuestion();
                    } else {
                        speak("Игра окончена! Вы супер-призёр!");
                        showModal("ПОБЕДА!", "Вы прошли все 20 вопросов!", () => location.reload());
                    }
                });
            }, 800);
        }

        document.getElementById('submit-letter').onclick = submitGuess;
        document.getElementById('letter-input').onkeypress = (e) => { if(e.key === 'Enter') submitGuess(); };
        
        document.getElementById('solve-word').onclick = () => {
            const guess = prompt("Введите слово целиком:").toUpperCase();
            if(!guess) return;
            if(guess === questions[currentLevel].a) {
                score += 2000;
                document.getElementById('score-display').textContent = score;
                document.querySelectorAll('.letter-inner').forEach(b => b.classList.add('revealed'));
                winLevel();
            } else {
                speak("Неправильно. Это не то слово.");
                showModal("УВЫ", "Слово названо неверно.", () => {
                    toggleInput(false);
                    wheelActive = true;
                    document.getElementById('spin-button').classList.remove('opacity-50', 'pointer-events-none');
                });
            }
        };

        window.onload = () => {
            createWheel();
            initQuestion();
